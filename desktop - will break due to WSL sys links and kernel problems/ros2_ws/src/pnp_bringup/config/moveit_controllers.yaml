# How MoveIt executes plans: which ros2_control controllers (action servers) own which joints.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names: [fr3_arm_controller, fr3_gripper]
  fr3_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
  fr3_gripper:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints: [fr3_finger_joint1]

trajectory_execution:
  allowed_execution_duration_scaling: 1.5   # sim over the network link can lag a little
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.02
