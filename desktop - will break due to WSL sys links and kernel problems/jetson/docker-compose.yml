# Jetson side of the real-camera link. On the Jetson (repo cloned to ~/pnp):
#   cd ~/pnp/jetson
#   JETSON_MODEL=orin docker compose up -d --build      # Orin Nano / NX / AGX (JetPack 6)
#   JETSON_MODEL=nano docker compose up -d --build      # original Jetson Nano (JetPack 4.6), slow first build
#   docker compose logs -f camera
# Then on the PC: config/remote_sensors.yaml enabled: true + the Jetson's IP, and
#   bringup.launch.py sim:=false camera:=jetson
services:
  camera:
    build:
      context: ..
      dockerfile: jetson/Dockerfile.${JETSON_MODEL:-orin}
    image: pnp-jetson-camera:${JETSON_MODEL:-orin}
    restart: unless-stopped
    network_mode: host          # DDS between the two containers on the Jetson, no port mapping needed
    ipc: host                   # Fast DDS shared memory between the containers works with a shared IPC namespace
    privileged: true            # USB access for the RealSense (librealsense talks to /dev/bus/usb directly)
    volumes:
      - /dev:/dev
      - ../config/realsense_d435i.yaml:/config/realsense_d435i.yaml:ro
    environment:
      - ROS_DOMAIN_ID=42

  bridge:
    # Official multi-arch image of the SAME zenoh bridge version the PC uses (must match: 1.10.1).
    image: eclipse/zenoh-bridge-ros2dds:1.10.1
    restart: unless-stopped
    network_mode: host
    ipc: host
    volumes:
      - ./zenoh_jetson.json5:/zenoh_jetson.json5:ro
    command: ["-c", "/zenoh_jetson.json5"]
    environment:
      - ROS_DOMAIN_ID=42
