[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pnp_core"
version = "0.1.0"
description = "Pure-Python perception/grasp math for the Isaac Sim pick & place project (no ROS, no Isaac)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<2", "opencv-python-headless>=4.8", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["pnp_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
