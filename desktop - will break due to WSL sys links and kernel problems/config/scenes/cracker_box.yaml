# Cracker box scene: the basic table, the YCB 003 cracker box as the target (docs/learning/12_second_object.md).
# Differences from basic.yaml: target, detector model, more room around the bigger object.
# Basic pick & place scene. All coordinates are in the robot base frame (fr3_link0), meters.
# The table top is at z = 0 and the robot base is bolted onto it.
name: cracker_box

table:
  center: [0.35, 0.0, -0.025]     # cuboid center; top surface at z = 0
  size: [1.30, 1.20, 0.05]
  height_above_floor: 0.75

target:
  object: cracker_box
  # Where the can may spawn (uniform XY, upright, random yaw).
  spawn_region: {x: [0.40, 0.65], y: [0.05, 0.35]}
  default_xy: [0.50, 0.20]
  detector_model: models/ycb2_seg_v1.pt       # 2 classes: soup_can + cracker_box

goal:
  xy: [0.50, -0.30]               # default place position (the green marker)
  yaw_deg: 0.0
  marker_radius_m: 0.05           # visual-only disc on the table
  # Where the goal marker may be moved by the sim's randomize commands: anywhere the can could also be
  # picked from (the camera sees it and top-down grasps are reachable), but never on top of the can.
  region: {x: [0.35, 0.65], y: [-0.40, 0.35]}
  min_separation_m: 0.22          # goal center <-> object center (the box is 16 x 7 cm)

# Phase 5 Layer A: KNOWN box obstacles. The sim keeps a pool of physical (light, pushable) boxes, off the table
# until the sim command "randomize_obstacles" lays out a random SOLVABLE arrangement (pnp_core/obstacles.py).
# The layout is published as /scene/known_obstacles and the pick & place node puts the boxes into MoveIt's
# planning scene. A box pushed > 5 mm during a task = a collision (tools/run_benchmark.py --obstacles).
obstacles:
  count: [1, 3]                   # boxes per layout (each pool entry used at most once)
  region: {x: [0.25, 0.80], y: [-0.50, 0.50]}
  clearance_m: 0.17               # obstacle footprint <-> object center / goal center: the box + the open hand
  robot_clearance_m: 0.25         # box footprint <-> robot base
  keep_clear:                     # never covered / hidden by a box: the AprilTag the calibration drift monitor
    - {xy: [0.78, 0.0], r_m: 0.07}   # watches (config/calibration_targets.yaml)
  padding_m: 0.015                # MoveIt boxes are this much bigger on every side (safety margin)
  mass_kg: 0.4                    # light enough that a hit visibly moves the box
  color: [0.25, 0.35, 0.65]
  pool:
    - {id: wall,  size: [0.03, 0.26, 0.16], role: between}   # across the can -> goal line when it fits
    - {id: block, size: [0.10, 0.10, 0.10]}
    - {id: tower, size: [0.06, 0.06, 0.24]}

physics:
  dt: 0.008333                    # 120 Hz
  solver_position_iterations: 32
  friction: {static: 1.0, dynamic: 1.0, restitution: 0.0}
