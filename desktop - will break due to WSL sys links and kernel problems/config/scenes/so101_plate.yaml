# SO-101 on the MOUNTED PLATE (2026-10-11): the real cell, and its sim twin (docs/learning/25_sim_real_parity.md).
# One scene for both: the real arm (Jetson: PNP_SCENE=config/scenes/so101_plate.yaml) and Isaac. Everything the real
# cell MEASURED is read from its calibration files (config/calibration/so101_plate/), so the twin follows each
# recalibration with no copying:
#   the D435i:      camera.mount.from_calibration -> the sim camera sits at the real one's calibrated pose (incl. its
#                   ~4 deg roll); the robot believes the same pose until the SIM's own calibration replaces it
#   the wrist D405: config/sim_reality.yaml profile `twin` -> the sim's TRUE D405 = the real unit's calibrated mount
#                   (5.6 mm / 1.9 deg from the CAD one the robot starts from: the sim calibration has to find it)
#   the arm:        config/servo_error.yaml profile `twin` -> the real arm's fitted joint offsets as its errors
# Run the twin:  bringup ... scene:=so101_plate reality:=twin servo_error:=twin (or set_reality.py twin)
# Coordinates: the robot base frame (base_link).
name: so101_plate
robot: so101
cell: so101_plate                 # calibrations of this cell: config/calibration/so101_plate/
calibration_targets: config/calibration_targets_so101.yaml

# 4' x 4' x 1/2" plywood. The base is screwed to it near the back edge (the D435i's first frame: the edge just behind
# the base). Its TOP is where the real arm's calibrated model sees it (2026-10-11): the wrist camera's looks read the
# plate at -16..-18 mm, and the board the D435i located lies at z = -18.4 mm -> -18.5 mm, so the twin matches what
# the robot perceives. If a ruler shows the base sits FLAT on the plate (base_link 2.4 mm up -> -2.4 mm), that 16 mm
# is arm calibration error for Phase A (docs/learning/25) and this goes back to -0.0024.
table:
  center: [0.51, 0.0, -0.02485]   # x -0.10 .. 1.12, y -0.61 .. 0.61; top at z = -0.0185 (12.7 mm thick)
  size: [1.219, 1.219, 0.0127]
  height_above_floor: 0.75
  color: [0.30, 0.20, 0.11]       # plywood (rendered under the twin lights)

# the twin's look (sim only): an indoor room (dim, warm), the arm's black printed parts
lights: {dome: 90.0, key: 350.0, key_rotate_xyz_deg: [-50.0, 25.0, 0.0]}
robot_color: [0.05, 0.05, 0.06]

# the REAL units' intrinsics (their camera_info, 2026-10-11): the sim renders with them (sim/scene.py set_pinhole)
wrist_camera_intrinsics: {fx: 327.861, fy: 327.408, cx: 321.353, cy: 175.095}

camera:
  fx: 605.382
  fy: 604.291
  cx: 322.546
  cy: 256.417
  mount:
    # the real D435i's calibrated pose (calibrate.py locate --via-wrist / fixed): ~0.53 m in front of the base,
    # 0.33 m up, 40 deg from straight down, looking back at the work band
    from_calibration: config/calibration/so101_plate/real_d435i.yaml

target:
  object: lego_2x4
  # the reach band on the 12 V 2 A supply: at ~28 cm the elbow hit 81 % load and every servo dropped off the bus
  spawn_region: {x: [0.15, 0.22], y: [-0.08, 0.08]}
  default_xy: [0.19, 0.03]
  detector_model: models/lego_seg_v1.pt       # trained on the OLD overhead view: retrain from this view (doc 25 B5)
extra_objects:
  - {name: lego_2x2, object: lego_2x2, default_xy: [0.165, -0.05], yaw: 0.4,
     spawn_region: {x: [0.15, 0.22], y: [-0.08, 0.08]}}

goal:
  xy: [0.18, -0.07]
  yaw_deg: 0.0
  marker_radius_m: 0.015
  region: {x: [0.15, 0.22], y: [-0.08, 0.08]}
  min_separation_m: 0.06

obstacles:
  count: [0, 1]
  region: {x: [0.10, 0.30], y: [-0.22, 0.22]}
  clearance_m: 0.055
  robot_clearance_m: 0.11
  keep_clear:                     # the drift monitor's AprilTag (in the D435i's view: pixel ~(597, 304))
    - {xy: [0.31, 0.17], r_m: 0.04}
  padding_m: 0.006
  mass_kg: 0.05
  color: [0.25, 0.35, 0.65]
  pool:
    - {id: wall,  size: [0.012, 0.08, 0.035], role: between}
    - {id: block, size: [0.03, 0.03, 0.03]}
    - {id: tower, size: [0.02, 0.02, 0.07]}

ui:
  reach_m: [0.13, 0.22]

perception:
  detector: {conf: 0.6, height_tolerance_m: 0.01, exclude_radius_m: 0.11, min_points: 30}
  wrist_refine: depth
  obstacle_cloud: {voxel_m: 0.01, robot_margin_m: 0.012, can_margin_m: 0.012, min_points_per_voxel: 2,
                   change_min_voxels: 8, change_robot_margin_m: 0.04}

physics:
  dt: 0.008333
  solver_position_iterations: 32
  friction: {static: 1.0, dynamic: 1.0, restitution: 0.0}
