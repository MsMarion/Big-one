# Seed catalog for objsearch. Import with `python -m objsearch db import` (existing ids are skipped).
# Seed entries start hidden from search (include_in_search: false); mark the ones you own in the
# dashboard (/objects) and they become origin=given + searchable. dims_mm are approximate datasheet
# values [length, width, height] incl. headers/pins unless noted; model_hints are unverified pointers
# for the acquire phase. `python -m objsearch db export` rewrites this file from the DB.
# Gripper fit (SO-ARM101) is computed from dims_mm: `python -m objsearch grasp`; flat modules, plates
# and cards stay in the catalog but are hidden from the default "pickable" selection.
version: 1
