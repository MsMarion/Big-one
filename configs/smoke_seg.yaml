# Semantic segmentation linear head on DINO patch features (synthetic RGB-D set).
# 336x448 (H, W) is a multiple of 112, so it fits patch 14 (DINOv2) and patch 16 (DINOv3).
name: smoke_seg_dinov2_s
task: seg
backbone: dinov2_s
img_size: [336, 448]
data: {root: $DINO_DATA/synthetic, train: train, val: val}
train: {epochs: 5, batch_size: 16, lr: 3.0e-3, unfreeze_last: 0, workers: 4, amp: bf16, log_every: 5}
